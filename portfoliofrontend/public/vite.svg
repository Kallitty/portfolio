<svg xmlns="http://www.w3.org/2000/svg" width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="url(#pencilGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="pencilGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #1a237e;"></stop> <!-- Dark Blue -->
      <stop offset="100%" style="stop-color: #3949ab;"></stop> <!-- Light Blue -->
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="16" height="18" rx="2" ry="2" fill="url(#pencilGradient)"></rect>
  <line x1="6" y1="1" x2="6" y2="19" stroke="#90caf9"></line> <!-- Blue accent -->
  <line x1="14" y1="1" x2="14" y2="19" stroke="#90caf9"></line> <!-- Blue accent -->
  <line x1="1" y1="5" x2="17" y2="5" stroke="#e3f2fd"></line> <!-- Light blue separator -->
  <circle cx="14" cy="13" r="2" fill="#1565c0"></circle> <!-- Circle with darker blue -->
  <text x="9" y="12" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Psalm</text>
</svg>
